<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f172a">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Edelweiss Digital"
  >

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Edelweiss Digital</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #0f172a;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: #0f172a;
      color: #fff;
    }

    #loading img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }

    #loadingTitle {
      font-size: 22px;
      font-weight: 700;
    }

    #loadingText {
      font-size: 14px;
      color: #94a3b8;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,.20);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }

    #errorBox {
      width: min(460px, 100%);
    }

    #errorTitle {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #errorText {
      color: #cbd5e1;
      line-height: 1.5;
      font-size: 14px;
    }

    #retry {
      margin-top: 20px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 15px;
      background: #fff;
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="loading">
      <img
        src="./icons/icon-192.png"
        alt="Edelweiss Digital"
      >

      <div id="loadingTitle">
        Edelweiss Digital
      </div>

      <div class="spinner"></div>

      <div id="loadingText">
        Membuka aplikasi...
      </div>
    </div>

    <iframe
      id="appFrame"
      title="Edelweiss Digital"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

  </div>

  <div id="error">
    <div id="errorBox">

      <div id="errorTitle">
        Aplikasi belum dapat dibuka
      </div>

      <div id="errorText">
        Periksa koneksi internet Anda kemudian coba lagi.
      </div>

      <button id="retry">
        Coba Lagi
      </button>

    </div>
  </div>

  <script src="./config.js"></script>

  <script>
    (function () {

      const GAS_URL =
        String(window.EDELWEISS_GAS_URL || "").trim();

      const frame =
        document.getElementById("appFrame");

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");

      const retry =
        document.getElementById("retry");

      function showError(message) {
        loading.style.display = "none";
        error.style.display = "flex";

        document.getElementById("errorText").textContent =
          message ||
          "Aplikasi belum dapat dibuka.";
      }

      function openApplication() {

        if (
          !GAS_URL ||
          GAS_URL.includes("PASTE_GAS_WEB_APP_URL_HERE")
        ) {
          showError(
            "URL Web App GAS belum tersedia."
          );
          return;
        }

        let target = GAS_URL;

        target +=
          (target.includes("?") ? "&" : "?") +
          "page=public";

        frame.src = target;
      }

      frame.addEventListener("load", function () {

        /*
         * iframe sudah menerima halaman.
         * Kita tidak membaca isi iframe karena domain
         * Google Apps Script berbeda dengan GitHub Pages.
         */
        setTimeout(function () {
          loading.style.display = "none";
        }, 500);

      });

      frame.addEventListener("error", function () {

        showError(
          "Aplikasi Edelweiss tidak dapat dimuat."
        );

      });

      retry.addEventListener(
        "click",
        function () {

          error.style.display = "none";
          loading.style.display = "flex";

          openApplication();

        }
      );

      openApplication();

      /*
       * Register Service Worker.
       */
      if ("serviceWorker" in navigator) {

        window.addEventListener(
          "load",
          function () {

            navigator.serviceWorker
              .register("./service-worker.js")
              .catch(function (err) {

                console.warn(
                  "Service Worker gagal:",
                  err
                );

              });

          }
        );

      }

    })();
  </script>

</body>
</html>
